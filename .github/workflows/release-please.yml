name: Release Please
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.repository == 'langchain-ai/langsmith-go'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}

    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # The langsmith CLI builds its generated commands against langsmith-go and
  # only releases against a released version. Starting the "stlc: sync CLI"
  # workflow in langchainplus right after a release moves the CLI to the new
  # tag without waiting for its daily run.
  trigger-cli-sync:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: self-hosted-ubuntu-small-amd64
    permissions:
      id-token: write
    steps:
      - name: Load GitHub App key from 1Password
        id: load-gh-app-secrets
        uses: 1password/load-secrets-action@3a12b0ab99d9cd590a3e9b5a90ea017210ed9556 # v4.0.1
        with:
          export-env: false
        env:
          OP_CONNECT_TOKEN: ${{ secrets.OP_CONNECT_TOKEN_INTERNAL }}
          OP_CONNECT_HOST: ${{ secrets.OP_CONNECT_HOST }}
          LANGCHAINPLUS_GITHUB_APP_PRIVATE_KEY: op://${{ secrets.INTERNAL_INFRA_OP_VAULT }}/langchain-actions-pr-bot/private_key

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: "Iv23liMFOFBcPTKFWi3S"
          private-key: ${{ steps.load-gh-app-secrets.outputs.LANGCHAINPLUS_GITHUB_APP_PRIVATE_KEY }}
          repositories: langchainplus
          permission-actions: write

      - name: Start the CLI sync in langchainplus
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh workflow run stlc_sync_cli.yml --repo langchain-ai/langchainplus
