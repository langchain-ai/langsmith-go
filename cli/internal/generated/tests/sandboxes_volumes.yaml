# Tests for `langsmith sandboxes volumes`. Contract cases run against a fake API.
resource: sandboxes:volumes

contract:
  - name: create with every field
    op: create
    args:
      - --name
      - data
      - --size-bytes
      - "10737418240"
      - --description
      - Training data
      # Map flags take a YAML literal.
      - --labels
      - "{team: infra}"
    response:
      status: 201
      body: &volume
        id: 11111111-1111-1111-1111-111111111111
        name: data
        size_bytes: 10737418240
        status: creating
        description: Training data
        labels: {team: infra}
        attachments: []
        created_at: "2026-11-20T00:00:00Z"
        updated_at: "2026-11-20T00:00:00Z"
    want:
      method: POST
      path: /api/v2/sandboxes/volumes
      body: {name: data, size_bytes: 10737418240, description: Training data, labels: {team: infra}}
      stdout: '"id": "11111111-1111-1111-1111-111111111111"'

  # Runs after the case above, so it also shows flag values do not carry over.
  - name: create sends only the flags given
    op: create
    args: [--name, scratch, --size-bytes, "1073741824", --workspace, 44444444-4444-4444-4444-444444444444]
    response:
      status: 201
      body: {id: 22222222-2222-2222-2222-222222222222, name: scratch, size_bytes: 1073741824, status: creating, attachments: []}
    want:
      method: POST
      path: /api/v2/sandboxes/volumes
      headers: {X-Tenant-Id: 44444444-4444-4444-4444-444444444444}
      body: {name: scratch, size_bytes: 1073741824}

  - name: create reports API errors
    op: create
    args: [--name, data, --size-bytes, "-1"]
    response:
      status: 400
      body: {detail: size_bytes must be greater than 0}
    want:
      method: POST
      path: /api/v2/sandboxes/volumes
      body: {name: data, size_bytes: -1}
      exit_code: 1
      stderr: 400 Bad Request

  - name: list with filters
    op: list
    args: [--name-contains, dat, --page-size, "10", --cursor, opaque-cursor]
    response:
      body: {items: [*volume], next_cursor: null}
    want:
      method: GET
      path: /api/v2/sandboxes/volumes
      query: {name_contains: dat, page_size: "10", cursor: opaque-cursor}
      stdout: Training data

  - name: retrieve by name
    op: retrieve
    args: [--volume, data]
    response:
      body: *volume
    want:
      method: GET
      path: /api/v2/sandboxes/volumes/data
      stdout: '"size_bytes": 10737418240'

  - name: update description and labels
    op: update
    args: [--volume, data, --description, Shared training data, --labels, "{team: ml, tier: gold}"]
    response:
      body: *volume
    want:
      method: PATCH
      path: /api/v2/sandboxes/volumes/data
      body: {description: Shared training data, labels: {team: ml, tier: gold}}

  - name: update sends only the flags given
    op: update
    args: [--volume, data, --description, Archived]
    response:
      body: *volume
    want:
      method: PATCH
      path: /api/v2/sandboxes/volumes/data
      body: {description: Archived}

  - name: clone with a new name, description and labels
    op: clone
    args: [--volume, data, --name, data-copy, --description, Copy for experiments, --labels, "{team: ml}"]
    response:
      status: 201
      body: {id: 33333333-3333-3333-3333-333333333333, name: data-copy, size_bytes: 10737418240, status: creating, source_volume_id: 11111111-1111-1111-1111-111111111111, attachments: []}
    want:
      method: POST
      path: /api/v2/sandboxes/volumes/data/clone
      body: {name: data-copy, description: Copy for experiments, labels: {team: ml}}
      stdout: '"source_volume_id": "11111111-1111-1111-1111-111111111111"'

  - name: clone reports API errors
    op: clone
    args: [--volume, missing, --name, copy]
    response:
      status: 404
      body: {detail: volume not found}
    want:
      method: POST
      path: /api/v2/sandboxes/volumes/missing/clone
      body: {name: copy}
      exit_code: 1
      stderr: 404 Not Found

  - name: delete after confirmation
    op: delete
    args: [--volume, data]
    stdin: "y\n"
    response:
      status: 204
    want:
      method: DELETE
      path: /api/v2/sandboxes/volumes/data
      stderr: This permanently deletes

  - name: delete without confirmation sends nothing
    op: delete
    args: [--volume, data]
    stdin: "n\n"
    want:
      requests: 0
      error: not confirmed

  - name: delete with --yes skips the prompt
    op: delete
    args: [--volume, data, --yes]
    response:
      status: 204
    want:
      method: DELETE
      path: /api/v2/sandboxes/volumes/data

lifecycle_skip: "Volumes are beta and enabled per workspace, so a live run fails in a workspace without them; a clone also needs its source to finish provisioning first."
